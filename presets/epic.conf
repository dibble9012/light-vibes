# Cinematic / trailer / big-drum music (tuned on Samuel Kim "Running Up That Hill" epic cover, 2026-11-01)
# Measured: sustained sub drone 60-120 Hz (spectrum mode would sit on one colour), main hits at 200-400% of avg,
# breakdowns at 140-170%. sensitivity 170 catches every hit and rests through breakdowns.
mode=beat
beat_low_hz=40
beat_high_hz=120
sensitivity=170
beat_avg_ms=1500
min_beat_ms=400
flash_on_beat=1
flash_ms=220
beat_step=3
brightness_min=2
brightness_max=10
loudness_range_db=7
min_interval_ms=120
