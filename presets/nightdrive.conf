# EV telemetry + music hybrid: motor regen/cruise/power sets the colour while music beats pulse the brightness
mode=nightdrive
auto_bpm=1
nd_source=power
power_low=-50
power_high=150
power_color_low=#7ED715
power_color_zero=#188EFD
power_color_high=#FF030A
speed_low=0
speed_high=80
speed_color_low=#7ED715
speed_color_high=#FF030A
speed_unit=auto
beat_low_hz=40
beat_high_hz=185
sensitivity=145
beat_avg_ms=1400
min_beat_ms=195
pulse_decay=45
brightness_min=2
brightness_max=10
min_interval_ms=35
