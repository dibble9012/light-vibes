# Responsive warm spectrum: marigold colours and boosts, fastest reactions (~1-step smoothing, 15% margin, 150 ms hold = code floor).
# Boosts = average of the levels needed to even out Marigolds (dark) and a treble-heavy track, so neither sits on one band.
# bass 40-120 -> red-orange, body 120-500 -> orange, voice/strings 500-2000 -> amber, presence -> lime, air -> teal
mode=spectrum
bands=40-120:23:1.9 120-500:26:2.2 500-2000:29:3 2000-6000:40:9 6000-16000:50:40
switch_margin=15
band_smoothing_ms=10
min_interval_ms=80
flash_on_beat=0
brightness_min=3
brightness_max=10
loudness_range_db=6
brightness_curve=range
