# Three bold bands + beat flash (2026-11-01). Bass red #22, midrange blue #0, treble teal #50.
# Boosts even out the typical level of each band (Marigolds + Running Up That Hill + All the Small Things),
# so the band standing out above its normal level wins rather than raw energy (which would always be bass).
# Kick hits (40-150 Hz) flash to 10 for 200 ms; wide loudness range keeps the in-between level mid-scale so the flash stands out.
mode=spectrum
bands=40-250:22:2 250-4000:0:1.2 4000-16000:50:16
switch_margin=15
band_smoothing_ms=20
min_interval_ms=150
flash_on_beat=1
flash_ms=200
beat_low_hz=40
beat_high_hz=150
sensitivity=200
beat_avg_ms=1500
min_beat_ms=250
brightness_min=1
brightness_max=10
loudness_range_db=12
brightness_curve=range
