# Your own colour, brightness pulses with beat strength (2026-11-01). pulse mode sends brightness only, never colour.
# Hit strength = (kick-band jump - 1) / (sensitivity/100 - 1): with 220, a 1.4x jump -> 1/3, 1.8x -> 2/3, 2.2x+ -> full.
# Measured kicks peak 115-260% on softer tracks and 300-450% on punchy ones; 250 grades the soft ones and saturates the punchy ones.
# Decay 35% kept per 100 ms -> each hit fades in ~150-200 ms; floor 1 = dimmest visible level (0 turns the lamp off).
# v1.0 pulse mode ignores overall loudness; mixing it in needs a code change.
mode=pulse
beat_low_hz=40
beat_high_hz=150
sensitivity=220
beat_avg_ms=1500
min_beat_ms=250
pulse_decay=35
brightness_min=1
brightness_max=10
min_interval_ms=80
flash_on_beat=0
