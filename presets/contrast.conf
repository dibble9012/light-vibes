# High-contrast test: lively timing and boosts, colours spread around the wheel so every switch is a clear jump
# Boosts = average of the levels needed to even out Marigolds (dark) and a treble-heavy track, so neither sits on one band.
# bass -> red #22, body -> amber #28, voice/guitar -> green #44, presence -> cyan #54, air -> violet #8
mode=spectrum
bands=40-120:22:1.9 120-500:28:2.2 500-2000:44:3 2000-6000:54:9 6000-16000:8:40
switch_margin=15
band_smoothing_ms=20
min_interval_ms=150
flash_on_beat=0
brightness_min=3
brightness_max=10
loudness_range_db=6
brightness_curve=range
